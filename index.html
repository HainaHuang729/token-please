<style>
  html, body { margin: 0; height: 100%; background: #dce6f0; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
  canvas {
    display: block; image-rendering: pixelated; image-rendering: crisp-edges;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  @media (pointer: fine) { canvas { cursor: none; } }
  .ui { position: fixed; top: 6px; right: 8px; display: flex; gap: 6px; z-index: 2; }
  .ui button {
    font: 12px system-ui, sans-serif; color: #e2edf8; background: #213958;
    border: 1px solid #6b87a8; border-radius: 2px; padding: 3px 8px; cursor: pointer;
  }
  .ui button:focus-visible { outline: 2px solid #e5bb5d; outline-offset: 2px; }
  .ui button:hover { color: #ffffff; }
  @media (max-height: 500px) { .ui { top: 2px; right: 2px; opacity: 0.55; } .ui button { font-size: 10px; padding: 1px 5px; } }
  #rotate {
    display: none; position: fixed; inset: 0; z-index: 3; background: #e7eef6;
    color: #20334e; font-size: 16px; text-align: center; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px; padding: 24px;
  }
  #rotate small { color: #64768c; font-size: 13px; }
  @media (orientation: portrait) and (max-width: 700px) { #rotate.show { display: flex; } }
  noscript { color: #ffffff; }
</style>

<body>
<canvas id="game" width="640" height="360" aria-label="Token, Please!：请出示你的上游 游戏画面"></canvas>
<div class="ui">
  <button id="mute" type="button">声音：开</button>
  <button id="full" type="button">全屏</button>
</div>
<div id="rotate" class="show">
  <div>把手机横过来玩</div>
  <small>竖屏也能玩，但字会很小</small>
  <button type="button" onclick="this.parentNode.classList.remove('show')" style="margin-top:8px;padding:6px 14px">先竖着玩</button>
</div>
<noscript>这个游戏需要开启 JavaScript。</noscript>

<script>
  document.getElementById('mute').addEventListener('click', () => toggleMute());
  const fullBtn = document.getElementById('full');
  const root = document.documentElement;
  if (!root.requestFullscreen && !root.webkitRequestFullscreen) fullBtn.style.display = 'none';
  fullBtn.addEventListener('click', () => {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      return;
    }
    const p = (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
    if (p && p.then) p.then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => {})).catch(() => {});
  });
</script>
